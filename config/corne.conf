# OLED SSD1306 128x32 (upstream corne shield, I2C 0x3C)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# No power switch: idle after 30 s, deep sleep after 15 min
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# nice_oled: rotating crystal on the right half
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=y

# LVGL 9 image blending peaked at 3720 bytes of display-thread stack (thread analyzer);
# ZMK's default 3072 overflowed silently and corrupted USB state during boot.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=6144

# SSD1306 only accepts writes starting on an 8-row page; without rounding, partial
# LVGL refreshes (e.g. animation frames) never reach the panel.
CONFIG_LV_Z_AREA_Y_ALIGNMENT_WIDTH=8
